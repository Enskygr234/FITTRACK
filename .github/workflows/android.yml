name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Araçları indir
        working-directory: android
        run: |
          mkdir -p tools
          curl -sSL -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -sSL -o tools/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - name: APK derle
        working-directory: android
        run: ./build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FITTRACK-apk
          path: android/dist/*.apk
